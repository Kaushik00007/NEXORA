<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 50 1050 850" width="100%" height="100%">
  <defs>
    <!-- Dark Theme Background (radial glow) -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#07070A" stop-opacity="0" />
    </radialGradient>
    
    <!-- Accent Glow Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
    
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>
    
    <linearGradient id="glassCardLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D06F" />
      <stop offset="100%" stop-color="#E0B44C" />
    </linearGradient>
    
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="chartArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0B44C" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E0B44C" stop-opacity="0" />
    </linearGradient>

    <!-- Mesh Pattern -->
    <pattern id="mesh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.015)" stroke-width="1"/>
    </pattern>

    <!-- Reusable avatars -->
    <g id="avatar">
      <circle cx="0" cy="0" r="14" fill="url(#glassCard)" stroke="#111827" stroke-width="2"/>
      <circle cx="0" cy="-3" r="4" fill="#D1D5DB"/>
      <path d="M -8 8 C -8 3, 8 3, 8 8" fill="none" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Background Layer -->
  <!-- Removed solid background to allow natural blending with parent container -->
  
  <!-- Glowing Orbs (Soft Ambient Lighting) -->
  <circle cx="950" cy="200" r="200" fill="rgba(139, 92, 246, 0.15)" filter="url(#heavyGlow)" />
  <circle cx="600" cy="650" r="250" fill="rgba(224, 180, 76, 0.12)" filter="url(#heavyGlow)" />
  <circle cx="1100" cy="700" r="200" fill="rgba(139, 92, 246, 0.1)" filter="url(#heavyGlow)" />

  <!-- Connection Lines / Workflow -->
  <path d="M 350 350 C 450 350, 500 500, 600 500" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="350" cy="350" r="5" fill="#8B5CF6" filter="url(#glowPurple)"/>
  <circle cx="600" cy="500" r="5" fill="#E0B44C" filter="url(#glowGold)"/>

  <path d="M 850 150 C 900 150, 950 250, 1000 250" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="850" cy="150" r="5" fill="#E0B44C" filter="url(#glowGold)"/>
  <circle cx="1000" cy="250" r="5" fill="#8B5CF6" filter="url(#glowPurple)"/>

  <!-- ============================================== -->
  <!-- MAIN WORKSPACE PANEL (Kanban Board)            -->
  <!-- ============================================== -->
  <g transform="translate(450, 180)" filter="url(#cardShadow)">
    <!-- Base Board -->
    <rect x="0" y="0" width="700" height="520" rx="24" fill="url(#glassCard)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    
    <!-- Header Area -->
    <rect x="30" y="30" width="40" height="40" rx="12" fill="url(#goldGradient)" />
    <!-- Example geometric logo icon -->
    <path d="M 42 42 L 58 42 L 58 58 L 42 58 Z" fill="none" stroke="#0D1117" stroke-width="2" />
    <path d="M 42 50 L 58 50" fill="none" stroke="#0D1117" stroke-width="2" />
    
    <text x="85" y="50" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">NEXORA</text>
    <text x="85" y="70" fill="#D1D5DB" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400">Sprint 4 • 12 Active Tasks</text>
    
    <!-- Top Right Actions -->
    <rect x="520" y="35" width="150" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="540" cy="53" r="12" fill="#8B5CF6"/>
    <circle cx="560" cy="53" r="12" fill="#E0B44C"/>
    <circle cx="580" cy="53" r="12" fill="rgba(255,255,255,0.2)"/>
    <text x="610" y="58" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Invite</text>
    
    <!-- Column: To Do -->
    <g transform="translate(30, 110)">
      <rect x="0" y="0" width="145" height="380" rx="12" fill="rgba(255,255,255,0.02)"/>
      <text x="15" y="25" fill="#D1D5DB" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">To Do</text>
      <rect x="110" y="12" width="20" height="20" rx="10" fill="rgba(255,255,255,0.1)"/>
      <text x="120" y="26" fill="#FFF" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">5</text>
      
      <!-- Card 1 -->
      <g transform="translate(10, 45)">
        <rect x="0" y="0" width="125" height="85" rx="8" fill="url(#glassCardLight)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <rect x="12" y="15" width="30" height="6" rx="3" fill="#8B5CF6"/>
        <rect x="12" y="35" width="90" height="6" rx="3" fill="#FFFFFF" opacity="0.9"/>
        <rect x="12" y="50" width="60" height="6" rx="3" fill="#FFFFFF" opacity="0.4"/>
        <use href="#avatar" x="100" y="65"/>
      </g>
      <!-- Card 2 -->
      <g transform="translate(10, 140)">
        <rect x="0" y="0" width="125" height="105" rx="8" fill="url(#glassCardLight)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <rect x="12" y="15" width="30" height="6" rx="3" fill="#E0B44C"/>
        <rect x="48" y="15" width="30" height="6" rx="3" fill="#10B981"/>
        <rect x="12" y="35" width="80" height="6" rx="3" fill="#FFFFFF" opacity="0.9"/>
        <rect x="12" y="50" width="100" height="6" rx="3" fill="#FFFFFF" opacity="0.4"/>
        <rect x="12" y="65" width="40" height="6" rx="3" fill="#FFFFFF" opacity="0.4"/>
        <use href="#avatar" x="100" y="85"/>
      </g>
    </g>

    <!-- Column: In Progress -->
    <g transform="translate(195, 110)">
      <rect x="0" y="0" width="145" height="380" rx="12" fill="rgba(255,255,255,0.02)"/>
      <text x="15" y="25" fill="#E0B44C" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">In Progress</text>
      <rect x="110" y="12" width="20" height="20" rx="10" fill="rgba(224, 180, 76, 0.2)"/>
      <text x="120" y="26" fill="#E0B44C" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">2</text>
      
      <!-- Active Card (Glowing) -->
      <g transform="translate(10, 45)">
        <rect x="0" y="0" width="125" height="115" rx="8" fill="url(#glassCardLight)" stroke="url(#goldGradient)" stroke-width="1.5" filter="url(#glowGold)"/>
        <rect x="0" y="0" width="125" height="115" rx="8" fill="rgba(224, 180, 76, 0.05)"/>
        <rect x="12" y="15" width="40" height="6" rx="3" fill="#E0B44C"/>
        <rect x="12" y="35" width="95" height="6" rx="3" fill="#FFFFFF" opacity="1"/>
        <rect x="12" y="50" width="70" height="6" rx="3" fill="#FFFFFF" opacity="0.7"/>
        
        <!-- Progress bar -->
        <rect x="12" y="75" width="100" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
        <rect x="12" y="75" width="65" height="4" rx="2" fill="#E0B44C"/>
        <text x="12" y="95" fill="#D1D5DB" font-family="'Inter', system-ui, sans-serif" font-size="10">65%</text>
        <use href="#avatar" x="100" y="95"/>
      </g>
    </g>

    <!-- Column: Review -->
    <g transform="translate(360, 110)">
      <rect x="0" y="0" width="145" height="380" rx="12" fill="rgba(255,255,255,0.02)"/>
      <text x="15" y="25" fill="#8B5CF6" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">Review</text>
      <rect x="110" y="12" width="20" height="20" rx="10" fill="rgba(139, 92, 246, 0.2)"/>
      <text x="120" y="26" fill="#8B5CF6" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">1</text>
      
      <!-- Review Card -->
      <g transform="translate(10, 45)">
        <rect x="0" y="0" width="125" height="85" rx="8" fill="url(#glassCardLight)" stroke="rgba(139, 92, 246, 0.5)" stroke-width="1.5"/>
        <rect x="12" y="15" width="30" height="6" rx="3" fill="#8B5CF6"/>
        <rect x="12" y="35" width="80" height="6" rx="3" fill="#FFFFFF" opacity="0.9"/>
        <rect x="12" y="50" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.4"/>
        <!-- Approved check indicator -->
        <circle cx="100" cy="65" r="8" fill="#10B981"/>
        <path d="M 97 65 L 99 67 L 103 63" fill="none" stroke="#0D1117" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Column: Done -->
    <g transform="translate(525, 110)">
      <rect x="0" y="0" width="145" height="380" rx="12" fill="rgba(255,255,255,0.02)"/>
      <text x="15" y="25" fill="#D1D5DB" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">Done</text>
      <rect x="110" y="12" width="20" height="20" rx="10" fill="rgba(255,255,255,0.1)"/>
      <text x="120" y="26" fill="#FFF" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">4</text>
      
      <g transform="translate(10, 45)" opacity="0.5">
        <rect x="0" y="0" width="125" height="70" rx="8" fill="url(#glassCardLight)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <rect x="12" y="15" width="80" height="6" rx="3" fill="#FFFFFF" opacity="0.6"/>
        <rect x="12" y="30" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.3"/>
        <path d="M 100 25 L 105 30 L 115 20" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g transform="translate(10, 125)" opacity="0.5">
        <rect x="0" y="0" width="125" height="70" rx="8" fill="url(#glassCardLight)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <rect x="12" y="15" width="90" height="6" rx="3" fill="#FFFFFF" opacity="0.6"/>
        <rect x="12" y="30" width="40" height="6" rx="3" fill="#FFFFFF" opacity="0.3"/>
        <path d="M 100 25 L 105 30 L 115 20" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- FLOATING CALENDAR CARD (Top Right Overlap)     -->
  <!-- ============================================== -->
  <g transform="translate(980, 120)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="200" height="180" rx="16" fill="url(#glassCard)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600">Sprint Timeline</text>
    <rect x="160" y="18" width="20" height="20" rx="6" fill="rgba(255,255,255,0.05)"/>
    <path d="M 166 28 L 174 28 M 170 24 L 170 32" fill="none" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>

    <!-- Calendar Grid -->
    <g transform="translate(20, 50)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
      <rect x="24" y="0" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
      <rect x="48" y="0" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
      <rect x="72" y="0" width="18" height="18" rx="4" fill="url(#goldGradient)" filter="url(#glowGold)"/>
      <rect x="96" y="0" width="18" height="18" rx="4" fill="rgba(224, 180, 76, 0.3)"/>
      <rect x="120" y="0" width="18" height="18" rx="4" fill="rgba(224, 180, 76, 0.3)"/>
      <rect x="144" y="0" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
      
      <!-- Row 2 -->
      <rect x="0" y="24" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
      <rect x="24" y="24" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
      <rect x="48" y="24" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
      <rect x="72" y="24" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
      <rect x="96" y="24" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
      <rect x="120" y="24" width="18" height="18" rx="4" fill="rgba(139, 92, 246, 0.8)" filter="url(#glowPurple)"/>
      <rect x="144" y="24" width="18" height="18" rx="4" fill="rgba(139, 92, 246, 0.3)"/>
      
      <!-- Row 3 -->
      <rect x="0" y="48" width="18" height="18" rx="4" fill="rgba(139, 92, 246, 0.3)"/>
      <rect x="24" y="48" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
      <rect x="48" y="48" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
      <rect x="72" y="48" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
      <rect x="96" y="48" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
      <rect x="120" y="48" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
      <rect x="144" y="48" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
    </g>

    <!-- Due Today Highlight -->
    <rect x="20" y="125" width="160" height="40" rx="8" fill="rgba(224, 180, 76, 0.1)"/>
    <circle cx="35" cy="145" r="4" fill="#E0B44C"/>
    <text x="50" y="142" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600">Frontend Release</text>
    <text x="50" y="156" fill="#E0B44C" font-family="'Inter', system-ui, sans-serif" font-size="10">Due Today, 5:00 PM</text>
  </g>

  <!-- ============================================== -->
  <!-- FLOATING TEAM COLLAB CARD (Top Left Overlap)   -->
  <!-- ============================================== -->
  <g transform="translate(250, 100)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="100" rx="16" fill="url(#glassCard)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600">Active Team</text>
    <circle cx="190" cy="25" r="4" fill="#10B981" filter="url(#glowGold)"/>

    <g transform="translate(20, 50)">
      <circle cx="15" cy="15" r="15" fill="rgba(224, 180, 76, 0.8)" stroke="#0D1117" stroke-width="2"/>
      <circle cx="35" cy="15" r="15" fill="rgba(139, 92, 246, 0.8)" stroke="#0D1117" stroke-width="2"/>
      <circle cx="55" cy="15" r="15" fill="rgba(209, 213, 219, 0.8)" stroke="#0D1117" stroke-width="2"/>
      <circle cx="75" cy="15" r="15" fill="rgba(59, 130, 246, 0.8)" stroke="#0D1117" stroke-width="2"/>
      <circle cx="95" cy="15" r="15" fill="rgba(255, 255, 255, 0.1)" stroke="#0D1117" stroke-width="2"/>
      <text x="95" y="19" fill="#FFF" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">+3</text>
    </g>
    <!-- Ping/Notification Line -->
    <path d="M 65 30 Q 75 15 85 30" fill="none" stroke="#E0B44C" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ============================================== -->
  <!-- FLOATING ANALYTICS CARD (Bottom Left Overlap)  -->
  <!-- ============================================== -->
  <g transform="translate(300, 560)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="200" rx="20" fill="url(#glassCard)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="24" y="36" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600">Project Velocity</text>
    <text x="24" y="60" fill="#E0B44C" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="700">+42%</text>
    <text x="95" y="58" fill="#D1D5DB" font-family="'Inter', system-ui, sans-serif" font-size="12">vs last sprint</text>

    <!-- Chart -->
    <g transform="translate(24, 90)">
      <path d="M 0 80 L 40 60 L 80 70 L 120 30 L 160 40 L 200 10 L 230 25" fill="none" stroke="url(#goldGradient)" stroke-width="3" filter="url(#glowGold)"/>
      <path d="M 0 80 L 40 60 L 80 70 L 120 30 L 160 40 L 200 10 L 230 25 L 230 100 L 0 100 Z" fill="url(#chartArea)"/>
      
      <!-- Chart Data Points -->
      <circle cx="120" cy="30" r="4" fill="#E0B44C" stroke="#0D1117" stroke-width="2"/>
      <circle cx="200" cy="10" r="5" fill="#FFFFFF" stroke="#E0B44C" stroke-width="3"/>
      
      <!-- Overlay Tooltip -->
      <rect x="180" y="-20" width="45" height="22" rx="4" fill="rgba(255,255,255,0.1)" stroke="rgba(224, 180, 76, 0.4)" stroke-width="1"/>
      <text x="202" y="-5" fill="#E0B44C" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">128</text>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- EXTRA DECORATIONS & PARTICLES                  -->
  <!-- ============================================== -->
  <g fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round">
    <!-- Abstract plus signs -->
    <path d="M 150 700 L 160 700 M 155 695 L 155 705" />
    <path d="M 1100 100 L 1110 100 M 1105 95 L 1105 105" stroke="rgba(224, 180, 76, 0.5)" />
    <path d="M 400 150 L 410 150 M 405 145 L 405 155" stroke="rgba(139, 92, 246, 0.5)"/>
  </g>
  
  <!-- Glowing specs -->
  <circle cx="200" cy="200" r="2" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="500" cy="100" r="3" fill="#E0B44C" opacity="0.6"/>
  <circle cx="1050" cy="400" r="2" fill="#8B5CF6" opacity="0.8"/>
  <circle cx="800" cy="750" r="2" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="950" cy="800" r="3" fill="#E0B44C" opacity="0.4"/>
</svg>