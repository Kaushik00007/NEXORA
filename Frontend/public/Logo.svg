<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D06F"/>
      <stop offset="100%" stop-color="#C9972B"/>
    </linearGradient>
    <linearGradient id="gold2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5D06F"/>
      <stop offset="100%" stop-color="#A57A20"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#C9972B" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Left Pillar -->
    <rect x="120" y="106" width="76" height="300" rx="38" fill="url(#gold1)" />
    <!-- Right Pillar -->
    <rect x="316" y="106" width="76" height="300" rx="38" fill="url(#gold1)" />
    <!-- Diagonal -->
    <rect x="218" y="76" width="76" height="360" rx="38" transform="rotate(-33.1 256 256)" fill="url(#gold2)" />
  </g>
